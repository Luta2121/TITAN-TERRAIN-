

name: Build TITAN TERRAIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
      - name: Download Godot 4.3
        shell: bash
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Godot export templates
        shell: bash
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p /tmp/godot_templates
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Check Android export preset
        shell: bash
        run: |
          set -e
          if [ ! -f export_presets.cfg ]; then
            echo "ERROR: export_presets.cfg is missing"
            exit 1
          fi
          if ! grep -q 'name="Android"' export_presets.cfg; then
            echo "ERROR: Android export preset not found"
            exit 1
          fi

      - name: Import Godot project
        shell: bash
        run: |
          set -e
          godot --headless --editor --path . --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/TITAN_TERRAIN.apk
          test -s build/TITAN_TERRAIN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-TERRAIN-APK
          path: build/TITAN_TERRAIN.apk
          if-no-files-found: error
