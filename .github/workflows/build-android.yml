name: Build TITAN TERRAIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/TITAN_TERRAIN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-TERRAIN-APK
          path: build/TITAN_TERRAIN.apk
          
